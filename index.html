<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка</title>

  <style>
    :root {
      --background: #10251e;
      --mint: #a5e6b1;
      --text: #edf7e9;
      --muted: #a0b9a3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(95, 165, 105, 0.17) 0 2px, transparent 3px),
        radial-gradient(circle at 82% 28%, rgba(166, 223, 161, 0.13) 0 2px, transparent 3px),
        radial-gradient(circle at 74% 82%, rgba(95, 165, 105, 0.15) 0 3px, transparent 4px),
        radial-gradient(ellipse at 15% 10%, #234735 0, transparent 36%),
        radial-gradient(ellipse at 90% 90%, #183d2d 0, transparent 42%),
        var(--background);
      background-size: 120px 120px, 170px 170px, 210px 210px, auto, auto, auto;
    }

    .game {
      width: min(100%, 490px);
      padding: 28px;
      border: 1px solid rgba(193, 235, 190, 0.12);
      border-radius: 30px;
      background: linear-gradient(
        155deg,
        rgba(31, 66, 49, 0.97),
        rgba(20, 48, 37, 0.98)
      );
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.32),
        inset 0 1px rgba(255, 255, 255, 0.06);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(165, 230, 177, 0.2);
      border-radius: 15px;
      background: rgba(128, 202, 139, 0.13);
      font-size: 23px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      padding: 7px 10px;
      border: 1px solid rgba(165, 230, 177, 0.14);
      border-radius: 999px;
      background: rgba(165, 230, 177, 0.08);
      color: #bfe7bd;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 13px;
    }

    .stat {
      padding: 11px 14px;
      border: 1px solid rgba(192, 228, 186, 0.1);
      border-radius: 16px;
      background: rgba(10, 31, 23, 0.27);
      text-align: left;
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .stat-value {
      color: var(--mint);
      font-size: 21px;
      font-weight: 750;
      line-height: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(187, 235, 176, 0.18);
      border-radius: 20px;
      background: #183a2b;
      box-shadow:
        inset 0 0 35px rgba(5, 20, 13, 0.25),
        0 12px 30px rgba(0, 0, 0, 0.14);
    }

    .message {
      min-height: 24px;
      margin: 14px 0 10px;
      color: #bfd1bb;
      font-size: 14px;
    }

    .start-button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px 20px;
      background: linear-gradient(135deg, #83d493, #62b978);
      color: #143221;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(72, 173, 98, 0.18);
      transition: transform 160ms ease, filter 160ms ease;
    }

    .start-button:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }

    .start-button:active {
      transform: translateY(1px);
    }

    .bottom-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 11px;
    }

    .keys {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    kbd {
      min-width: 22px;
      padding: 3px 5px;
      border: 1px solid rgba(194, 225, 187, 0.18);
      border-radius: 6px;
      background: rgba(9, 28, 20, 0.34);
      color: #d9eed4;
      font: inherit;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 420px) {
      .game {
        padding: 20px;
        border-radius: 24px;
      }

      h1 {
        font-size: 26px;
      }

      .badge {
        font-size: 10px;
      }

      .bottom-info {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header class="topline">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🐍</div>
        <div>
          <h1>Змейка</h1>
          <p class="subtitle">Собирай яблоки в лесу</p>
        </div>
      </div>
      <div class="badge">ЛЕСНОЙ РЕЖИМ</div>
    </header>

    <section class="stats" aria-label="Счёт игры">
      <div class="stat">
        <span class="stat-label">Текущий счёт</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Лучший результат</span>
        <span class="stat-value" id="bestScore">0</span>
      </div>
    </section>

    <canvas id="board" width="420" height="420"></canvas>

    <p class="message" id="message">Нажми кнопку или WASD, чтобы начать</p>
    <button class="start-button" id="startButton">Начать игру</button>

    <div class="bottom-info">
      <span>Управление</span>
      <div class="keys">
        <kbd>W</kbd> вверх
        <kbd>A</kbd> влево
        <kbd>S</kbd> вниз
        <kbd>D</kbd> вправо
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const bestScoreElement = document.getElementById("bestScore");
    const messageElement = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    const cells = 21;
    const cellSize = canvas.width / cells;

    // Физические клавиши WASD работают и при русской раскладке.
    const directions = {
      KeyW: { x: 0, y: -1 },
      KeyS: { x: 0, y: 1 },
      KeyA: { x: -1, y: 0 },
      KeyD: { x: 1, y: 0 }
    };

    let snake;
    let previousSnake;
    let food;
    let direction;
    let nextDirection;
    let score = 0;
    let bestScore = Number(localStorage.getItem("snakeBestScore")) || 0;
    let state = "ready";
    let lastStep = null;
    let stepDuration = 125;

    bestScoreElement.textContent = bestScore;

    function startGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      previousSnake = snake.map(part => ({ ...part }));
      direction = directions.KeyD;
      nextDirection = directions.KeyD;
      score = 0;
      stepDuration = 125;
      lastStep = null;
      state = "playing";

      scoreElement.textContent = score;
      messageElement.textContent = "";
      startButton.textContent = "Начать заново";

      placeFood();
      draw(1);
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * cells),
          y: Math.floor(Math.random() * cells)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function changeDirection(keyCode) {
      const newDirection = directions[keyCode];
      if (!newDirection) return;

      // Не разрешаем мгновенно развернуться в противоположную сторону.
      const isOpposite =
        newDirection.x + direction.x === 0 &&
        newDirection.y + direction.y === 0;

      if (!isOpposite) {
        nextDirection = newDirection;
      }
    }

    function finishGame(message) {
      state = "over";
      messageElement.textContent = message;
      startButton.textContent = "Играть ещё";
    }

    function update() {
      direction = nextDirection;

      const oldSnake = snake.map(part => ({ ...part }));
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const ateFood = head.x === food.x && head.y === food.y;

      const hitWall =
        head.x < 0 || head.x >= cells ||
        head.y < 0 || head.y >= cells;

      // Если змейка не ест, хвост сдвинется и освободит клетку.
      const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
      const hitSelf = bodyToCheck.some(
        part => part.x === head.x && part.y === head.y
      );

      if (hitWall || hitSelf) {
        finishGame(`Игра окончена! Счёт: ${score}`);
        return;
      }

      snake.unshift(head);

      if (!ateFood) {
        snake.pop();
      } else {
        score += 1;
        scoreElement.textContent = score;

        if (score > bestScore) {
          bestScore = score;
          bestScoreElement.textContent = bestScore;
          localStorage.setItem("snakeBestScore", bestScore);
        }

        stepDuration = Math.max(90, 125 - score * 1.5);

        if (snake.length === cells * cells) {
          finishGame("Победа! Всё поле собрано!");
        } else {
          placeFood();
        }
      }

      // Координаты предыдущего положения нужны для плавной анимации.
      previousSnake = snake.map((_, index) => {
        const oldIndex = Math.max(0, index - 1);
        return oldSnake[oldIndex] || oldSnake[oldSnake.length - 1];
      });
    }

    function draw(progress = 1) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#183a2b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ненавязчивая сетка.
      ctx.strokeStyle = "rgba(183, 226, 170, 0.055)";
      ctx.lineWidth = 1;

      for (let i = 1; i < cells; i++) {
        const position = i * cellSize;

        ctx.beginPath();
        ctx.moveTo(position, 0);
        ctx.lineTo(position, canvas.height);
        ctx.moveTo(0, position);
        ctx.lineTo(canvas.width, position);
        ctx.stroke();
      }

      // Яблоко: округлая форма, черенок и листик.
      const foodX = (food.x + 0.5) * cellSize;
      const foodY = (food.y + 0.5) * cellSize;

      ctx.save();
      ctx.translate(foodX, foodY);
      ctx.scale(cellSize, cellSize);

      // Мягкое свечение.
      ctx.fillStyle = "rgba(242, 163, 126, 0.12)";
      ctx.beginPath();
      ctx.arc(0, 0, 0.46, 0, Math.PI * 2);
      ctx.fill();

      // Силуэт яблока.
      ctx.fillStyle = "#f08069";
      ctx.beginPath();
      ctx.moveTo(0, -0.12);
      ctx.bezierCurveTo(-0.12, -0.25, -0.39, -0.23, -0.39, 0.02);
      ctx.bezierCurveTo(-0.39, 0.24, -0.20, 0.39, -0.06, 0.36);
      ctx.bezierCurveTo(-0.02, 0.35, 0.02, 0.35, 0.06, 0.36);
      ctx.bezierCurveTo(0.20, 0.39, 0.39, 0.24, 0.39, 0.02);
      ctx.bezierCurveTo(0.39, -0.23, 0.12, -0.25, 0, -0.12);
      ctx.closePath();
      ctx.fill();

      // Блик на яблоке.
      ctx.fillStyle = "rgba(255, 224, 190, 0.55)";
      ctx.beginPath();
      ctx.ellipse(-0.17, 0.02, 0.055, 0.12, -0.35, 0, Math.PI * 2);
      ctx.fill();

      // Черенок.
      ctx.strokeStyle = "#76533a";
      ctx.lineWidth = 0.045;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, -0.20);
      ctx.quadraticCurveTo(0.02, -0.31, 0.08, -0.34);
      ctx.stroke();

      // Листик.
      ctx.fillStyle = "#8bc878";
      ctx.beginPath();
      ctx.moveTo(0.025, -0.27);
      ctx.quadraticCurveTo(0.16, -0.39, 0.22, -0.29);
      ctx.quadraticCurveTo(0.15, -0.20, 0.025, -0.27);
      ctx.fill();

      ctx.restore();

      // Плавное движение змейки между клетками.
      const eased = progress * progress * (3 - 2 * progress);

      const points = snake.map((part, index) => {
        const from = previousSnake[index] || part;
        const x = from.x + (part.x - from.x) * eased;
        const y = from.y + (part.y - from.y) * eased;

        return {
          x: (x + 0.5) * cellSize,
          y: (y + 0.5) * cellSize
        };
      });

      if (points.length > 0) {
        const bodyPath = new Path2D();
        bodyPath.moveTo(points[0].x, points[0].y);

        // Скруглённые переходы между частями тела.
        for (let i = 1; i < points.length - 1; i++) {
          const midpointX = (points[i].x + points[i + 1].x) / 2;
          const midpointY = (points[i].y + points[i + 1].y) / 2;

          bodyPath.quadraticCurveTo(
            points[i].x,
            points[i].y,
            midpointX,
            midpointY
          );
        }

        if (points.length > 1) {
          const tail = points[points.length - 1];
          bodyPath.lineTo(tail.x, tail.y);
        }

        // Единая полоса с закруглёнными головой, хвостом и поворотами.
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        ctx.strokeStyle = "#4b9961";
        ctx.lineWidth = cellSize * 0.88;
        ctx.stroke(bodyPath);

        ctx.strokeStyle = "#72c888";
        ctx.lineWidth = cellSize * 0.76;
        ctx.stroke(bodyPath);

        // Глаза следуют за плавно движущейся головой.
        const head = points[0];
        const eyeOffset = cellSize * 0.15;

        ctx.fillStyle = "#24543a";

        if (direction.x !== 0) {
          const eyeX = head.x + direction.x * cellSize * 0.1;

          ctx.beginPath();
          ctx.arc(eyeX, head.y - eyeOffset, 1.8, 0, Math.PI * 2);
          ctx.arc(eyeX, head.y + eyeOffset, 1.8, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const eyeY = head.y + direction.y * cellSize * 0.1;

          ctx.beginPath();
          ctx.arc(head.x - eyeOffset, eyeY, 1.8, 0, Math.PI * 2);
          ctx.arc(head.x + eyeOffset, eyeY, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function gameLoop(timestamp) {
      if (state === "playing") {
        if (lastStep === null) {
          lastStep = timestamp;
        }

        if (timestamp - lastStep >= stepDuration) {
          update();
          lastStep = timestamp;
        }

        const progress = state === "playing"
          ? Math.min((timestamp - lastStep) / stepDuration, 1)
          : 1;

        draw(progress);
      } else {
        draw(1);
      }

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", event => {
      if (!directions[event.code]) return;

      event.preventDefault();

      if (state === "ready") {
        startGame();
      }

      if (state === "playing") {
        changeDirection(event.code);
      }
    });

    startButton.addEventListener("click", startGame);

    // Начальный экран.
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];

    previousSnake = snake.map(part => ({ ...part }));
    direction = directions.KeyD;
    nextDirection = directions.KeyD;
    food = { x: 14, y: 10 };

    draw(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
