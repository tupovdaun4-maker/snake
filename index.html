<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка</title>

  <style>
    :root {
      --background: #10251e;
      --mint: #a5e6b1;
      --text: #edf7e9;
      --muted: #a0b9a3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 15% 10%, #234735 0, transparent 36%),
        radial-gradient(ellipse at 90% 90%, #183d2d 0, transparent 42%),
        var(--background);
    }

    .game {
      width: min(100%, 760px);
      padding: 28px;
      border: 1px solid rgba(193, 235, 190, 0.12);
      border-radius: 30px;
      background: linear-gradient(155deg, rgba(31, 66, 49, 0.97), rgba(20, 48, 37, 0.98));
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(165, 230, 177, 0.2);
      border-radius: 15px;
      background: rgba(128, 202, 139, 0.13);
      font-size: 23px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      padding: 7px 10px;
      border: 1px solid rgba(165, 230, 177, 0.14);
      border-radius: 999px;
      background: rgba(165, 230, 177, 0.08);
      color: #bfe7bd;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 13px;
    }

    .stat {
      padding: 11px 14px;
      border: 1px solid rgba(192, 228, 186, 0.1);
      border-radius: 16px;
      background: rgba(10, 31, 23, 0.27);
    }

    .stat-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
    }

    .stat-value {
      color: var(--mint);
      font-size: 21px;
      font-weight: 750;
    }

    .play-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      align-items: center;
      gap: 18px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(187, 235, 176, 0.18);
      border-radius: 20px;
      background: #183a2b;
    }

    .character-card {
      min-height: 230px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(135, 190, 230, 0.18);
      border-radius: 20px;
      background:
        radial-gradient(ellipse at 50% 50%, rgba(57, 122, 173, 0.19), transparent 68%),
        rgba(10, 31, 35, 0.35);
      text-align: center;
    }

    #baraCanvas {
      width: 100%;
      max-width: 160px;
      height: auto;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .character-name {
      margin: 8px 0 0;
      color: #c6e9ff;
      font-size: 16px;
      font-weight: 800;
    }

    .character-caption {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .message {
      min-height: 24px;
      margin: 14px 0 10px;
      color: #bfd1bb;
      font-size: 14px;
    }

    .start-button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 13px 20px;
      background: linear-gradient(135deg, #83d493, #62b978);
      color: #143221;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .start-button:hover {
      filter: brightness(1.07);
    }

    .bottom-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 11px;
    }

    .keys {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    kbd {
      min-width: 22px;
      padding: 3px 5px;
      border: 1px solid rgba(194, 225, 187, 0.18);
      border-radius: 6px;
      background: rgba(9, 28, 20, 0.34);
      color: #d9eed4;
      font: inherit;
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 600px) {
      .game {
        padding: 20px;
      }

      .play-area {
        grid-template-columns: 1fr;
      }

      .character-card {
        min-height: 180px;
      }

      #baraCanvas {
        max-width: 125px;
      }
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 26px;
      }

      .badge {
        font-size: 10px;
      }

      .bottom-info {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header class="topline">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🐍</div>
        <div>
          <h1>Змейка</h1>
          <p class="subtitle">Собирай яблоки в лесу</p>
        </div>
      </div>
      <div class="badge">ЛЕСНОЙ РЕЖИМ</div>
    </header>

    <section class="stats" aria-label="Счёт игры">
      <div class="stat">
        <span class="stat-label">Текущий счёт</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Лучший результат</span>
        <span class="stat-value" id="bestScore">0</span>
      </div>
    </section>

    <div class="play-area">
      <canvas id="board" width="420" height="420" aria-label="Игровое поле"></canvas>

      <aside class="character-card" aria-label="Персонаж Баратрум">
        <canvas id="baraCanvas" width="180" height="210"></canvas>
        <p class="character-name">Баратрум</p>
        <p class="character-caption">Дух из далёких миров</p>
      </aside>
    </div>

    <p class="message" id="message">Нажми кнопку или WASD, чтобы начать</p>
    <button class="start-button" id="startButton" type="button">Начать игру</button>

    <div class="bottom-info">
      <span>Управление</span>
      <div class="keys">
        <kbd>W</kbd> вверх
        <kbd>A</kbd> влево
        <kbd>S</kbd> вниз
        <kbd>D</kbd> вправо
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const baraCanvas = document.getElementById("baraCanvas");
    const baraCtx = baraCanvas.getContext("2d");

    const scoreElement = document.getElementById("score");
    const bestScoreElement = document.getElementById("bestScore");
    const messageElement = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    const cells = 21;
    const cellSize = canvas.width / cells;

    const directions = {
      KeyW: { x: 0, y: -1 },
      KeyS: { x: 0, y: 1 },
      KeyA: { x: -1, y: 0 },
      KeyD: { x: 1, y: 0 }
    };

    let snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];

    let food = { x: 14, y: 10 };
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let score = 0;
    let bestScore = 0;
    let state = "ready";
    let prevSnake = snake.map(part => ({ ...part }));
const stepDuration = 125;
let lastFrameTime = 0;
let accumulator = 0;
let rafId = null;

    try {
      bestScore = Number(localStorage.getItem("snakeBestScore")) || 0;
    } catch {
      bestScore = 0;
    }

    bestScoreElement.textContent = bestScore;

    function interpolateCoord(prev, curr, t) {
  let diff = curr - prev;
  if (diff > cells / 2) diff -= cells;
  if (diff < -cells / 2) diff += cells;
  return (prev + diff * t + cells) % cells;
}

function getVisualPoints(progress) {
  return snake.map((curr, i) => {
    const prev = prevSnake[i] || prevSnake[prevSnake.length - 1];
    return {
      x: (interpolateCoord(prev.x, curr.x, progress) + 0.5) * cellSize,
      y: (interpolateCoord(prev.y, curr.y, progress) + 0.5) * cellSize
    };
  });
}

function draw(progress = 1) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#183a2b";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Сетка поля.
  ctx.strokeStyle = "rgba(183, 226, 170, 0.07)";
  ctx.lineWidth = 1;
  for (let i = 1; i < cells; i++) {
    const position = i * cellSize;
    ctx.beginPath();
    ctx.moveTo(position, 0);
    ctx.lineTo(position, canvas.height);
    ctx.moveTo(0, position);
    ctx.lineTo(canvas.width, position);
    ctx.stroke();
  }

  // Яблоко.
  const appleX = (food.x + 0.5) * cellSize;
  const appleY = (food.y + 0.5) * cellSize;
  ctx.fillStyle = "#f08069";
  ctx.beginPath();
  ctx.arc(appleX, appleY, cellSize * 0.34, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#76533a";
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(appleX, appleY - cellSize * 0.25);
  ctx.lineTo(appleX + 2, appleY - cellSize * 0.43);
  ctx.stroke();

  // Цельная змейка с закруглёнными краями.
  const points = getVisualPoints(progress);
  if (points.length === 0) return;

  const bodyWidth = cellSize * 0.78;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#72c888";
  ctx.lineWidth = bodyWidth;

  ctx.beginPath();
  ctx.moveTo(points.at(0).x, points.at(0).y);

  for (let i = 1; i < points.length; i++) {
    const p1 = points[i - 1];
    const p2 = points[i];
    if (Math.abs(p2.x - p1.x) > cellSize * 2 || Math.abs(p2.y - p1.y) > cellSize * 2) {
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p2.x, p2.y);
    } else {
      ctx.lineTo(p2.x, p2.y);
    }
  }
  ctx.stroke();

  // Голова (цветовой акцент и глаза).
  const head = points.at(0);
  ctx.fillStyle = "#a5e6b1";
  ctx.beginPath();
  ctx.arc(head.x, head.y, bodyWidth / 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#24543a";
  if (direction.x !== 0) {
    const eyeX = head.x + direction.x * cellSize * 0.16;
    ctx.beginPath();
    ctx.arc(eyeX, head.y - cellSize * 0.16, 2, 0, Math.PI * 2);
    ctx.arc(eyeX, head.y + cellSize * 0.16, 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const eyeY = head.y + direction.y * cellSize * 0.16;
    ctx.beginPath();
    ctx.arc(head.x - cellSize * 0.16, eyeY, 2, 0, Math.PI * 2);
    ctx.arc(head.x + cellSize * 0.16, eyeY, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

    function drawBara() {
      const c = baraCtx;
      const w = baraCanvas.width;
      const h = baraCanvas.height;

      c.clearRect(0, 0, w, h);

      // Мягкое сияние за персонажем.
      const glow = c.createRadialGradient(90, 105, 8, 90, 105, 88);
      glow.addColorStop(0, "rgba(91, 183, 255, 0.32)");
      glow.addColorStop(1, "rgba(30, 70, 120, 0)");
      c.fillStyle = glow;
      c.fillRect(0, 0, w, h);

      // Тело и плечи.
      c.fillStyle = "#315b87";
      c.beginPath();
      c.ellipse(90, 157, 48, 39, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = "#477aa7";
      c.beginPath();
      c.moveTo(48, 145);
      c.quadraticCurveTo(43, 110, 60, 88);
      c.lineTo(120, 88);
      c.quadraticCurveTo(139, 111, 132, 145);
      c.quadraticCurveTo(112, 162, 90, 160);
      c.quadraticCurveTo(65, 162, 48, 145);
      c.fill();

      // Рога.
      c.fillStyle = "#d1d7d0";
      c.beginPath();
      c.moveTo(61, 82);
      c.quadraticCurveTo(38, 62, 28, 25);
      c.quadraticCurveTo(62, 45, 76, 69);
      c.closePath();
      c.fill();

      c.beginPath();
      c.moveTo(119, 82);
      c.quadraticCurveTo(142, 62, 152, 25);
      c.quadraticCurveTo(118, 45, 104, 69);
      c.closePath();
      c.fill();

      // Тёмная морда.
      c.fillStyle = "#26384b";
      c.beginPath();
      c.moveTo(57, 79);
      c.quadraticCurveTo(90, 56, 123, 79);
      c.lineTo(116, 122);
      c.quadraticCurveTo(108, 143, 90, 148);
      c.quadraticCurveTo(72, 143, 64, 122);
      c.closePath();
      c.fill();

      // Брови.
      c.strokeStyle = "#b5d8ee";
      c.lineWidth = 6;
      c.lineCap = "round";
      c.beginPath();
      c.moveTo(63, 87);
      c.lineTo(82, 94);
      c.moveTo(117, 87);
      c.lineTo(98, 94);
      c.stroke();

      // Глаза.
      c.fillStyle = "#ffcf69";
      c.beginPath();
      c.ellipse(75, 101, 7, 5, 0, 0, Math.PI * 2);
      c.ellipse(105, 101, 7, 5, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = "#17242e";
      c.beginPath();
      c.arc(77, 101, 2.2, 0, Math.PI * 2);
      c.arc(103, 101, 2.2, 0, Math.PI * 2);
      c.fill();

      // Нос и кольцо.
      c.fillStyle = "#17242e";
      c.beginPath();
      c.moveTo(84, 111);
      c.lineTo(96, 111);
      c.lineTo(90, 119);
      c.closePath();
      c.fill();

      c.strokeStyle = "#d7bd78";
      c.lineWidth = 3;
      c.beginPath();
      c.arc(90, 123, 7, 0.1, Math.PI - 0.1);
      c.stroke();

      // Декоративный нагрудник.
      c.fillStyle = "#b59656";
      c.beginPath();
      c.moveTo(75, 151);
      c.lineTo(90, 166);
      c.lineTo(105, 151);
      c.lineTo(101, 180);
      c.lineTo(90, 187);
      c.lineTo(79, 180);
      c.closePath();
      c.fill();

      c.fillStyle = "#e0c47c";
      c.beginPath();
      c.arc(90, 164, 5, 0, Math.PI * 2);
      c.fill();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * cells),
          y: Math.floor(Math.random() * cells)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function finishGame(text) {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  state = "over";
  messageElement.textContent = text;
  startButton.textContent = "Играть ещё";
  draw(1);
}

function update() {
      prevSnake = snake.map(part => ({ ...part }));
      direction = nextDirection;

      const head = {
        x: (snake.at(0).x + direction.x + cells) % cells,
        y: (snake.at(0).y + direction.y + cells) % cells
      };

      const ateFood = head.x === food.x && head.y === food.y;
      const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
      const hitSelf = bodyToCheck.some(part => part.x === head.x && part.y === head.y);

      if (hitSelf) {
        finishGame(`Игра окончена! Счёт: ${score}`);
        return false;
      }

      snake.unshift(head);

      if (ateFood) {
        prevSnake.push({ ...prevSnake.at(-1) });
        score += 1;
        scoreElement.textContent = score;
        if (score > bestScore) {
          bestScore = score;
          bestScoreElement.textContent = bestScore;
          try {
            localStorage.setItem("snakeBestScore", String(bestScore));
          } catch {}
        }
        if (snake.length === cells * cells) {
          finishGame("Победа! Всё поле собрано!");
          return false;
        }
        placeFood();
      } else {
        snake.pop();
      }
      return true;
    }

    function gameLoop(timestamp) {
      if (state !== "playing") return;

      if (!lastFrameTime) lastFrameTime = timestamp;
      const delta = timestamp - lastFrameTime;
      lastFrameTime = timestamp;
      accumulator += delta;

      while (accumulator >= stepDuration) {
        accumulator -= stepDuration;
        if (!update()) return;
      }

      draw(Math.min(accumulator / stepDuration, 1));
      rafId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      if (rafId) cancelAnimationFrame(rafId);
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      prevSnake = snake.map(part => ({ ...part }));
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      scoreElement.textContent = score;
      messageElement.textContent = "";
      startButton.textContent = "Начать заново";
      state = "playing";

      placeFood();
      update();

      lastFrameTime = 0;
      accumulator = 0;
      rafId = requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", event => {
      const newDirection = directions[event.code];
      if (!newDirection) return;
      event.preventDefault();

      if (state === "ready") {
        startGame();
      }

      const isOpposite =
        newDirection.x + direction.x === 0 &&
        newDirection.y + direction.y === 0;

      if (state === "playing" && !isOpposite) {
        nextDirection = newDirection;
      }
    });

    startButton.addEventListener("click", startGame);

    draw(1);
    drawBara();
  </script>
</body>
</html>
